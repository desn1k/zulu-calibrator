name: zulu-calibrator

services:
  app:
    build: .
    image: zulu-calibrator:${IMAGE_TAG:?set IMAGE_TAG in .env, e.g. v0.1.0-rc1}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - app-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: zulu-calibrator:${IMAGE_TAG:?set IMAGE_TAG in .env, e.g. v0.1.0-rc1}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["backup.sh"]
    # Healthy while the newest backup is less than 26 hours old.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /backups -maxdepth 1 -name 'app-*.db' -mmin -1560)\""]
      interval: 5m
      timeout: 10s
      start_period: 2m
      start_interval: 2s
      retries: 1
    environment:
      DB_PATH: /data/app.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - app-data:/data
      - backups:/backups

volumes:
  app-data:
  backups:
  caddy-data:
  caddy-config:
